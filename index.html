<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#152323" />
    <meta name="description" content="仏像が錫杖と仏技で落武者の群れを薙ぎ払う、ブラウザ3Dアクション。千の魂を解き放て。" />
    <link rel="icon" href="data:," />
    <title>仏像無双（仮） — 千の魂を解き放て</title>
  </head>
  <body>
    <main id="game-root" aria-label="仏像無双（仮）">
      <div id="ui-root"><section class="boot-screen"><h1>仏像無双（仮）</h1><p role="status">寺院を読み込んでいます…</p></section></div>
    </main>
    <noscript>このゲームにはJavaScriptが必要です。</noscript>
    <script>
      if (location.protocol === 'file:') {
        const status = document.querySelector('.boot-screen [role="status"]');
        if (status) {
          status.textContent = 'このゲームはVite開発サーバーから起動してください。';
          const steps = document.createElement('pre');
          steps.textContent = 'PowerShell（このフォルダーで実行）:\nnpm ci\nnpm run dev\n\nアクセス: http://127.0.0.1:5173/';
          steps.style.whiteSpace = 'pre-wrap';
          status.after(steps);
        }
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
